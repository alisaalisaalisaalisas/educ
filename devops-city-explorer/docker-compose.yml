version: '3.8'

services:
  devops-city-explorer:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-city-explorer:latest
    container_name: devops-city-explorer-game
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
