---
- name: Bootstrap Dev Infrastructure & Kubernetes Stack
  hosts: all
  tasks:
    - name: Ensure K8s namespace exists
      kubernetes.core.k8s:
        name: beer-marketplace-ansible
        api_version: v1
        kind: Namespace
        state: present
      ignore_errors: true

    - name: Verify Minikube status
      command: minikube status
      register: minikube_out
      changed_when: false

    - name: Print Minikube Status
      debug:
        var: minikube_out.stdout_lines
